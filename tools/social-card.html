<!DOCTYPE html>
<!-- Source for assets/img/social.png (1200x630 Open Graph card).
     Regenerate with: tools/social-card.sh -->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  html{margin:0;background:#0b0908}
  body{margin:0;width:1200px;height:630px;overflow:hidden;background:radial-gradient(120% 100% at 20% 0%,#1d1512,#0b0908 62%);color:#f4efe8;
       font-family:"Oswald",Arial,sans-serif;display:flex;flex-direction:column;
       justify-content:center;padding:0 88px;position:relative}
  .glow{position:absolute;inset:auto -10% -40% -10%;height:70%;
        background:radial-gradient(50% 60% at 30% 100%,rgba(242,106,27,.35),transparent 70%),
                   radial-gradient(45% 55% at 78% 100%,rgba(138,58,18,.4),transparent 72%)}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:22px;letter-spacing:.34em;
           text-transform:uppercase;color:#f26a1b;margin-bottom:26px;position:relative}
  h1{font-size:132px;line-height:.92;margin:0;text-transform:uppercase;position:relative}
  h1 em{font-style:normal;background:linear-gradient(180deg,#ffa33d,#c04a17 70%,#8a3a12);
        -webkit-background-clip:text;background-clip:text;color:transparent}
  p{font-family:"JetBrains Mono",monospace;font-size:24px;letter-spacing:.12em;
    color:#b9aea4;margin:34px 0 0;position:relative}
  .rule{width:120px;height:3px;background:#f26a1b;margin-top:38px;position:relative}
</style></head>
<body>
  <div class="glow"></div>
  <p class="eyebrow">Smoked Meat Academy &middot; Jordan</p>
  <h1>Smoke. Fire. <em>Meat.</em></h1>
  <p>Low and slow, wood fired, no shortcuts</p>
  <div class="rule"></div>
</body></html>
